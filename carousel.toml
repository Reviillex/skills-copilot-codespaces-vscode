# Carousel pipeline settings. Every key is optional; missing keys fall back to
# the defaults in src/carousel/config.py.

output_dir = "output"

[brand]
author = "dr. Hilmi Amirul Haq"
handle = "@akunanda"          # replace with your Instagram handle
primary = "#0F4C5C"           # headings, badges
accent = "#E36414"            # big numbers, highlights
background = "#FBF8F3"
text = "#1B1B1B"
caveat_background = "#FFF4E0"
font = "Plus Jakarta Sans"    # Google Font; falls back to sans-serif offline

[writing]
sapaan = "Anda"               # or "kamu"; used consistently in every slide
min_slides = 6                # content slides, excluding the auto reference slide
max_slides = 9
max_headline_words = 12
max_body_words = 40
max_hashtags = 5

[model]
name = "claude-opus-5"
effort = "high"

[pubmed]
email = ""                    # NCBI asks for a contact email; set yours
days = 7
max_candidates = 20
# Journal filter (PubMed [ta] abbreviations). Empty list = no journal filter.
journals = [
  "N Engl J Med", "Lancet", "JAMA", "BMJ", "Ann Intern Med",
  "JAMA Intern Med", "JAMA Netw Open", "Nat Med", "PLoS Med", "BMC Med",
  "Cochrane Database Syst Rev", "Lancet Public Health", "Br J Sports Med",
  "Am J Clin Nutr", "Diabetes Care", "Circulation", "Eur Heart J",
  "Sleep Med Rev", "JAMA Pediatr", "JAMA Psychiatry",
]
# Daily-life topics, matched against title/abstract.
topics = [
  "sleep", "physical activity", "exercise", "walking", "sedentary",
  "diet", "nutrition", "coffee", "tea", "sugar-sweetened", "ultra-processed",
  "screen time", "smoking", "vaping", "alcohol", "stress", "loneliness",
  "body weight", "hydration", "sunlight",
]
